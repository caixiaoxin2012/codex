[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scl-ai-analyzer"
version = "0.1.0"
description = "Parse Siemens SCL variable declarations and generate engineering reports."
requires-python = ">=3.10"
authors = [{ name = "Shanghai Xilin Automation Technology Co., Ltd." }]

[project.scripts]
scl-ai-analyzer = "scl_ai_analyzer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
