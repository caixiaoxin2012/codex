[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scl-ai-analyzer"
version = "0.9.2"
description = "Analyze Siemens SCL projects with project AST, TIA Portal V16-V21 exports, CASE state machines, industrial device recognition, and alarm/interlock classification."
requires-python = ">=3.10"
authors = [{ name = "Shanghai Xilin Automation Technology Co., Ltd." }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scl-ai-analyzer = "scl_ai_analyzer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
