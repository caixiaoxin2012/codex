[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scl-ai-analyzer"
version = "0.9.6"
description = "Analyze Siemens SCL projects and generate traceable Chinese automatic-flow narratives from state-action-device-condition-next-state causal chains, with alarms/interlocks, standard-library semantics, engineering knowledge graph, bidirectional source mapping, and TIA Portal V16-V21 export support."
requires-python = ">=3.10"
authors = [{ name = "Shanghai Xilin Automation Technology Co., Ltd." }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scl-ai-analyzer = "scl_ai_analyzer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
