[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scl-ai-analyzer"
version = "0.11.3"
description = "Windows-first Siemens SCL/TIA PLC Code Review tool with unified secure SCL/XML loading, SHA-256 integrity verification and audit logging, secure XML guards, tag-quality checks, optional AI Chinese review explanations, standalone EXE packaging, project-wide block-call and variable cross references, OB-rooted call paths, bidirectional source navigation, semantic block analysis, flow narratives, causal chains, alarms/interlocks, standard-library semantics, and engineering knowledge graph support."
requires-python = ">=3.10"
authors = [{ name = "Shanghai Xilin Automation Technology Co., Ltd." }]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
ai = ["openai"]
packaging = ["PyInstaller>=6.11"]
dev = ["pytest>=8"]

[project.scripts]
scl-ai-analyzer = "scl_ai_analyzer.cli:main"
scl-ai-analyzer-gui = "scl_ai_analyzer.gui_v0113:main"

[tool.setuptools]
package-dir = {"" = "src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
